<!-- ═══ html/preview.html — Pré-visualização do book (tela cheia) e área usada só na impressão (PDF) ═══ -->
<!-- Preview do book -->
<div class="pv" id="pv">
  <div class="pvbar">
    <span class="pvt">Pré-visualização · clique numa seção para editá-la</span>
    <div class="pv-actions">
      <button class="btn btn-ghost btn-sm" id="pv-export">⬇ Exportar</button>
      <button class="btn btn-sec btn-sm" id="pv-close">✕ Fechar</button>
    </div>
  </div>
  <div class="pvwrap"><div id="book-out"></div></div>
</div>

<!-- Área usada só na impressão (PDF) -->
<div id="print-root"></div>
