<!-- Tema antes de pintar (evita piscar): escolha salva ou preferência do sistema. Lógica: js/ui/theme.js -->
<!-- App instalável (PWA): manifesto só no servidor (abrindo o arquivo direto não existe) e o pedido de instalação
     guardado para o botão de Configurações › App desktop (js/editor/admin-site.js) -->
<script>if(/^https?:$/.test(location.protocol)){var m=document.createElement("link");m.rel="manifest";m.href="manifest.webmanifest";document.head.appendChild(m);addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__btInstall=e;dispatchEvent(new Event("bt-installable"))});addEventListener("appinstalled",function(){window.__btInstall=null;window.__btInstalled=true;dispatchEvent(new Event("bt-installable"))});if("serviceWorker"in navigator&&isSecureContext)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("bt-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){}</script>
